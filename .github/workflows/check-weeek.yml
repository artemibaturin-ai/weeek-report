name: Обновление и деплой панели Weeek

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: weeek-report-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Получение всех задач и деплой
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Проверить секреты
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$WEEEK_TOKEN" || {
            echo "::error::Не найден WEEEK_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Не найден CLOUDFLARE_API_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Не найден CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

          echo "Все необходимые секреты заданы"

      - name: Проверить синтаксис Python
        shell: bash
        run: |
          python -m py_compile weeek_report.py

      - name: Создать панель
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: |
          python -u weeek_report.py

      - name: Проверить результат
        shell: bash
        run: |
          test -s public/index.html
          test -s public/weeek_tasks.csv
          test -s public/weeek_tasks.json
          test -s public/weeek_projects.json
          test -s public/weeek_raw_tasks.json

          python - <<'PY'
          import json
          from pathlib import Path

          tasks = json.loads(
              Path("public/weeek_tasks.json")
              .read_text(encoding="utf-8")
          )

          projects = json.loads(
              Path("public/weeek_projects.json")
              .read_text(encoding="utf-8")
          )

          if not isinstance(tasks, list):
              raise SystemExit("weeek_tasks.json не является списком")

          if not isinstance(projects, list):
              raise SystemExit("weeek_projects.json не является списком")

          if len(tasks) < 27:
              raise SystemExit(
                  f"Получено только {len(tasks)} задач, ожидалось минимум 27"
              )

          task_213 = next(
              (
                  task for task in tasks
                  if str(task.get("id")) == "213"
              ),
              None,
          )

          if task_213 is None:
              raise SystemExit("Задача 213 не найдена")

          if task_213.get("status") != "Выполнено":
              raise SystemExit(
                  "У задачи 213 неверный статус: "
                  + repr(task_213.get("status"))
              )

          if task_213.get("isCompleted") is not True:
              raise SystemExit(
                  "У задачи 213 isCompleted не равен true"
              )

          print(f"Проверка пройдена: задач={len(tasks)}")
          print(f"Проверка пройдена: проектов={len(projects)}")
          print(f"Проверка пройдена: задача 213={task_213}")
          PY

      - name: Сохранить данные в GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html
          git add public/weeek_tasks.csv
          git add public/weeek_tasks.json
          git add public/weeek_projects.json
          git add public/weeek_raw_tasks.json

          if git diff --cached --quiet; then
            echo "Изменений для коммита нет"
          else
            git commit -m "Обновление всех задач Weeek"
            git push origin HEAD:main
          fi

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить Wrangler
        shell: bash
        run: |
          npm install --global wrangler@4
          wrangler --version

      - name: Проверить конфигурацию Worker
        shell: bash
        run: |
          test -s worker.js
          test -s wrangler.jsonc
          test -s public/index.html

          echo "wrangler.jsonc:"
          cat wrangler.jsonc

      - name: Проверить доступ Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami

      - name: Деплой в Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc
