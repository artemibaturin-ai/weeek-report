name: Отчет по задачам Weeek

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Создать отчет Weeek
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: python weeek_report.py

      - name: Сохранить отчет
        uses: actions/upload-artifact@v4
        with:
          name: weeek-report
          path: |
            weeek_report.html
            weeek_tasks.csv
            weeek_tasks.json
