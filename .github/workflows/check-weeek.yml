name: Проверка пагинации Weeek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Запустить диагностику
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: python -u weeek_report.py

      - name: Сохранить результаты
        uses: actions/upload-artifact@v4
        with:
          name: weeek-pagination-tests
          path: weeek_pagination_tests.json
