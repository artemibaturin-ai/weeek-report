name: Обновление веб-панели Weeek

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Проверить версию Python
        run: python --version

      - name: Получить данные и создать панель
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: python weeek_report.py

      - name: Проверить созданные файлы
        run: |
          ls -la
          test -f index.html
          test -f weeek_tasks.csv
          test -f weeek_tasks.json

      - name: Сохранить результат в GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html weeek_tasks.csv weeek_tasks.json

          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновление панели Weeek"
            git push
          fi
