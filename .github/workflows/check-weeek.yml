name: Обновление и деплой панели Weeek

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: weeek-report-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-and-deploy:
    name: Получение всех задач и деплой
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Проверить секреты
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$WEEEK_TOKEN" || {
            echo "::error::Не найден WEEEK_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Не найден CLOUDFLARE_API_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Не найден CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

          echo "Все секреты заданы"

      - name: Проверить синтаксис Python
        shell: bash
        run: |
          python -m py_compile weeek_report.py

      - name: Создать панель Weeek
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEK_TOKEN }}
        run: |
          python -u weeek_report.py

      - name: Проверить созданные файлы
        shell: bash
        run: |
          test -s public/index.html || {
            echo "::error::Не создан public/index.html"
            exit 1
          }

          test -s public/weeek_tasks.json || {
            echo "::error::Не создан public/weeek_tasks.json"
            exit 1
          }

          test -s public/weeek_projects.json || {
            echo "::error::Не создан public/weeek_projects.json"
            exit 1
          }

          test -s public/weeek_tasks.csv || {
            echo "::error::Не создан public/weeek_tasks.csv"
            exit 1
          }

          ls -lah public

      - name: Проверить данные Weeek
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tasks = json.loads(
              Path("public/weeek_tasks.json")
              .read_text(encoding="utf-8")
          )

          projects = json.loads(
              Path("public/weeek_projects.json")
              .read_text(encoding="utf-8")
          )

          if not isinstance(tasks, list):
              raise SystemExit(
                  "Ошибка: weeek_tasks.json не является списком"
              )

          if not isinstance(projects, list):
              raise SystemExit(
                  "Ошибка: weeek_projects.json не является списком"
              )

          if len(tasks) < 27:
              raise SystemExit(
                  f"Ошибка: получено {len(tasks)} задач, "
                  "ожидалось минимум 27"
              )

          task_213 = next(
              (
                  task
                  for task in tasks
                  if str(task.get("id")) == "213"
              ),
              None,
          )

          if task_213 is None:
              raise SystemExit(
                  "Ошибка: задача 213 не найдена"
              )

          if task_213.get("status") != "Выполнено":
              raise SystemExit(
                  "Ошибка: статус задачи 213: "
                  + repr(task_213.get("status"))
              )

          if task_213.get("isCompleted") is not True:
              raise SystemExit(
                  "Ошибка: isCompleted задачи 213 не равен true"
              )

          project_ids = {
              str(task.get("projectId"))
              for task in tasks
              if task.get("projectId") is not None
          }

          if "2" not in project_ids:
              raise SystemExit(
                  "Ошибка: отсутствует projectId=2"
              )

          if "4" not in project_ids:
              raise SystemExit(
                  "Ошибка: отсутствует projectId=4"
              )

          completed_count = sum(
              task.get("isCompleted") is True
              for task in tasks
          )

          print(f"Задач: {len(tasks)}")
          print(f"Проектов: {len(projects)}")
          print(f"Project IDs: {sorted(project_ids)}")
          print(f"Выполнено: {completed_count}")
          print(f"Задача 213: {task_213}")
          PY

      - name: Сохранить результаты в GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html
          git add public/weeek_tasks.json
          git add public/weeek_projects.json
          git add public/weeek_tasks.csv

          if git diff --cached --quiet; then
            echo "Изменений для коммита нет"
          else
            git commit -m "Обновление панели Weeek"
            git push origin HEAD:main
          fi

      - name: Установить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Установить Wrangler
        shell: bash
        run: |
          npm install --global wrangler@4
          wrangler --version

      - name: Проверить конфигурацию Cloudflare
        shell: bash
        run: |
          test -s worker.js || {
            echo "::error::Не найден worker.js"
            exit 1
          }

          test -s wrangler.jsonc || {
            echo "::error::Не найден wrangler.jsonc"
            exit 1
          }

          test -s public/index.html || {
            echo "::error::Не найден public/index.html"
            exit 1
          }

          cat wrangler.jsonc

      - name: Проверить доступ Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami

      - name: Деплой в Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc
