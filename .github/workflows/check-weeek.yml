name: Обновление и деплой панели Weeek

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: weeek-report-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: Создание и деплой панели
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests
          fi

      - name: Проверить секреты
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$WEEEK_TOKEN" || {
            echo "::error::Не найден секрет WEEEK_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Не найден секрет CLOUDFLARE_API_TOKEN"
            exit 1
          }

          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Не найден секрет CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

          echo "WEEEK_TOKEN: задан"
          echo "CLOUDFLARE_API_TOKEN: задан"
          echo "CLOUDFLARE_ACCOUNT_ID: задан"

      - name: Проверить наличие файлов проекта
        shell: bash
        run: |
          test -s weeek_report.py || {
            echo "::error::Не найден weeek_report.py"
            exit 1
          }

          test -s worker.js || {
            echo "::error::Не найден worker.js"
            exit 1
          }

          test -s wrangler.jsonc || {
            echo "::error::Не найден wrangler.jsonc"
            exit 1
          }

      - name: Проверить синтаксис Python
        shell: bash
        run: |
          python -m py_compile weeek_report.py

      - name: Создать папку public
        shell: bash
        run: |
          mkdir -p public

      - name: Создать панель Weeek
        shell: bash
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: |
          python -u weeek_report.py

      - name: Проверить созданные файлы
        shell: bash
        run: |
          test -s public/index.html || {
            echo "::error::Не создан public/index.html"
            exit 1
          }

          test -s public/weeek_tasks.csv || {
            echo "::error::Не создан public/weeek_tasks.csv"
            exit 1
          }

          test -s public/weeek_tasks.json || {
            echo "::error::Не создан public/weeek_tasks.json"
            exit 1
          }

          echo "Созданные файлы:"
          ls -lah public

      - name: Сохранить результат в GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html
          git add public/weeek_tasks.csv
          git add public/weeek_tasks.json

          if git diff --cached --quiet; then
            echo "Изменений для коммита нет"
          else
            git commit -m "Обновление панели Weeek"
            git push origin HEAD:main
          fi

      - name: Установить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Установить Wrangler
        shell: bash
        run: |
          npm install --global wrangler@4
          wrangler --version

      - name: Проверить конфигурацию Cloudflare
        shell: bash
        run: |
          test -s worker.js || {
            echo "::error::Не найден worker.js"
            exit 1
          }

          test -s wrangler.jsonc || {
            echo "::error::Не найден wrangler.jsonc"
            exit 1
          }

          test -s public/index.html || {
            echo "::error::Не найден public/index.html"
            exit 1
          }

          echo "Конфигурация Cloudflare:"
          cat wrangler.jsonc

      - name: Проверить доступ Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami

      - name: Деплой в Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.jsonc
