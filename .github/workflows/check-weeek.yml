name: Проверка Weeek API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить доступ к Weeek
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: python weeek_report.py
