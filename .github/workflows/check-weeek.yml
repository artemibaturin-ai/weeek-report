name: Диагностика Weeek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-weeek:
    name: Проверка пагинации Weeek
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить requests
        run: python -m pip install requests

      - name: Проверить WEEEK_TOKEN
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: |
          if [ -z "$WEEEK_TOKEN" ]; then
            echo "::error::Не найден WEEEK_TOKEN"
            exit 1
          fi

      - name: Выполнить диагностику API
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: |
          python weeek_api_probe.py

      - name: Сохранить результат диагностики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weeek-api-probe
          path: weeek_api_probe.json
          if-no-files-found: ignore
