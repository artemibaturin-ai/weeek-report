name: Проверка Weeek API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Получить данные Weeek
        env:
          WEEEK_TOKEN: ${{ secrets.WEEEK_TOKEN }}
        run: python weeek_report.py

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: weeek-api-data
          path: weeek_api_data.json
